name: Build and publish RIFFLE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/archive.json'
      - 'data/generated.json'
      - 'README.md'
  schedule:
    # GitHub schedules use UTC. 22:00 UTC = 07:00 JST next day.
    - cron: '0 22 * * *'
    # 09:00 UTC = 18:00 JST same day.
    - cron: '0 9 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: riffle-pages
  cancel-in-progress: false

jobs:
  build-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional AI summarizer
        run: pip install 'openai>=1.75,<4'
      - name: Build latest editions
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: |
          python scripts/build.py --refresh
      - name: Persist daily reading history
        run: |
          git config user.name "riffle-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive.json data/generated.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh RIFFLE editions [skip ci]"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
